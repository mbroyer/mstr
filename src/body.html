<div class="app" id="app">
  <header class="top">
    <span class="mark"><i aria-hidden="true"></i>MSTR</span>
    <div class="topr">
      <button type="button" class="ib" id="view" aria-pressed="false" aria-label="Show as molecule" title="Show as molecule"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.4" fill="currentColor"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18.5" cy="12" r="1.9" fill="currentColor"/><circle cx="7.4" cy="7.4" r="1.9" fill="currentColor"/><circle cx="8.8" cy="17.6" r="1.9" fill="currentColor"/></svg></button>
      <button type="button" class="pill" id="clr">Clear</button>
      <button type="button" class="ib" id="theme" aria-label="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <div class="head">
    <div class="prow"><h1 class="preset" id="preName">Amapiano</h1><button type="button" class="ib pick" id="preBtn" aria-haspopup="dialog" aria-label="Choose beat" title="Choose beat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    <p class="sub" id="sub"></p>
  </div>
  <main class="tracks" id="tracks" aria-label="Tracks"></main>
  <canvas class="mol" id="mol" hidden aria-label="Your beat as a molecule, tap to go back to the grid" role="button" tabindex="0"></canvas>
  <div class="trk beatrow" aria-hidden="true"><div class="tl"></div><div class="steps"><div class="grp"><span>1</span><span></span><span></span><span></span></div><div class="grp"><span>2</span><span></span><span></span><span></span></div><div class="grp"><span>3</span><span></span><span></span><span></span></div><div class="grp"><span>4</span><span></span><span></span><span></span></div></div></div>
  <footer class="transport">
    <button type="button" class="play" id="play" aria-label="Play (Space)"></button>
    <button type="button" class="pill" id="fxBtn" aria-haspopup="dialog" aria-label="Effects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="fxl">Effects</span><span class="fxn" id="fxN"></span></button>
    <button type="button" class="pill" id="drop" aria-label="Drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.5L5 13.5h6l-1.5 8 8.5-11h-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="fxl">Drop</span></button>
    <button type="button" class="pill" id="share" aria-haspopup="dialog" aria-label="Share or download" title="Share or download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="tempo" id="tempoBtn" aria-haspopup="dialog" aria-label="Tempo and swing"><span class="tv"><span class="swt" id="swTxt">Swing 0 %</span><span class="big"><span id="bpm">100</span><small>bpm</small></span></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>
<section class="sheet" id="sheet" aria-labelledby="sheetT" hidden></section>
