<div class="app" id="app">
  <header class="top">
    <button type="button" class="ib" id="vGrid" hidden aria-label="Back to the grid"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="mark"><i aria-hidden="true"></i>MSTR</span>
    <div class="topr"><button type="button" class="pill share" id="vCard" aria-label="Share: your beat as an orbit, video and link"><canvas id="miniOrb" width="44" height="44" aria-hidden="true"></canvas><svg class="shi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Share</span></button></div>
  </header>
  <div class="head">
    <div class="prow"><h1 class="preset" id="preName" title="Name your beat"><span id="preTxt">Amapiano</span><svg class="pen" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></h1></div>
    <p class="sub"><span id="sub"></span><button type="button" class="lnk" id="preBtn" aria-haspopup="dialog">Change beat<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></p>
  </div>
  <main class="tracks" id="tracks" aria-label="Tracks"></main>
  <canvas class="mol" id="mol" hidden aria-label="Your beat as an orbit. Tap the ring to play or stop, tap the title to name it, swipe sideways to change the colour" role="button" tabindex="0"></canvas>
  <div class="hue" id="hue" hidden role="radiogroup" aria-label="Orbit colour"></div>
  <div class="cardfoot" id="cardfoot" hidden><button type="button" class="pill wide go" id="shCardBtn">Share video</button></div>
  <div class="cardlinks" id="cardlinks" hidden><button type="button" class="lnk" id="shSend"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Copy link</span></button><button type="button" class="lnk" id="shWav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Download WAV</span></button></div>
  <p class="shnote" id="shCardT" hidden></p>
  <div class="trk beatrow" aria-hidden="true"><div class="tl"></div><div class="steps"><div class="grp"><span>1</span><span></span><span></span><span></span></div><div class="grp"><span>2</span><span></span><span></span><span></span></div><div class="grp"><span>3</span><span></span><span></span><span></span></div><div class="grp"><span>4</span><span></span><span></span><span></span></div></div></div>
  <footer class="transport">
    <button type="button" class="play" id="play" aria-label="Play (Space)"></button>
    <button type="button" class="pill" id="fxBtn" aria-haspopup="dialog" aria-label="Effects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="fxl">Effects</span><span class="fxn" id="fxN"></span></button>
    <button type="button" class="pill" id="drop" aria-label="Drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.5L5 13.5h6l-1.5 8 8.5-11h-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="fxl">Drop</span></button>
    <button type="button" class="tempo" id="tempoBtn" aria-haspopup="dialog" aria-label="Tempo and swing"><span class="tv"><span class="swt" id="swTxt">Swing 0 %</span><span class="big"><span id="bpm">100</span><small>bpm</small></span></span></button>
  </footer>
</div>
<section class="sheet" id="sheet" aria-labelledby="sheetT" hidden></section>
