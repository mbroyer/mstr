/* Grundlage aus Vokki/NumNum: Farben, Schriften, Knöpfe */
[hidden]{display:none!important}
#qFb{gap:14px;padding:16px}
#qFb .diff{display:flex;flex-direction:column;gap:10px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
#qFb .dr{display:grid;grid-template-columns:5.2em 1fr;align-items:baseline;column-gap:10px;font-weight:800;font-size:1.2rem;overflow-wrap:anywhere}
#qFb .dl{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
#qFb .do{color:var(--muted);font-size:.95rem;font-weight:700}
#qFb mark{color:inherit;border-radius:5px;padding:1px 3px}
#qFb mark.bad{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
#qFb mark.fix{background:var(--good-bg);color:var(--good)}
#qFb .ex .btn{align-self:flex-start;margin-top:6px}
#qFb .ex{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
#qFb .exl{color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
#qFb .ext{font-weight:700;font-size:1.1rem;line-height:1.4;overflow-wrap:anywhere}
#qFb .ext b{background:var(--warn-bg);border-radius:5px;padding:1px 4px}
#qFb .fbs{color:var(--ink);font-weight:700;font-size:.95rem;opacity:.85}
#qFb .fbs[hidden]{display:none}
#qFb .fbact{display:flex;flex-direction:row;gap:12px;align-items:stretch}
#qFb .fbact #qNext{flex:1}
#qFb .fbact .small{flex:none;padding-inline:18px}
#qFb .diff{background:transparent;border:0;padding:0;gap:6px}
#qFb .dr{grid-template-columns:4.6em 1fr}
#qFb .dr:first-child{display:none}
#qFb .dr:first-child .dl{font-size:.72rem}
#qFb .dr:nth-child(2){background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--f-display);font-weight:600;font-size:1.9rem;line-height:1.2;grid-template-columns:1fr;position:relative}
#qFb .dr:nth-child(2) .dl{font-family:var(--f-body);font-size:.72rem;font-weight:800;order:-1;margin-bottom:2px}
#qFb .ex{background:transparent;border:0;border-top:2px dashed color-mix(in srgb,var(--ink) 18%,transparent);border-radius:0;padding:12px 2px 0;gap:6px}
#qFb .ext{font-size:1rem;font-weight:600;opacity:.9}
#qFb .ex .btn{padding:6px 14px;font-size:.9rem;min-height:0;margin-top:2px}
#qFb .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.qword.long{font-size:clamp(1.35rem,5.5vw,1.9rem);line-height:1.3}.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--ink);margin-inline:2px}.hsent{font-weight:700;font-size:1.25rem;line-height:1.4;text-wrap:balance;margin-top:6px;overflow-wrap:anywhere}.qhint{display:flex;flex-direction:column;gap:4px;align-items:center;margin-top:6px}.qhint .hde{font-family:var(--f-display);font-weight:600;font-size:1.3rem;color:var(--accent);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px 14px}.qhint .hgf{color:var(--muted);font-weight:800;font-size:.95rem}

.qcard.cz{border-style:dashed;border-color:var(--accent)}.qcard.cz .eyebrow{color:var(--accent-edge)}.qcard.cz .qword.long{font-size:clamp(1.5rem,6.2vw,2.1rem)}.qhint .hde{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 22px;background:var(--warn-bg);border:2px solid var(--accent);color:var(--ink)}.qhint .hdl{font-family:var(--f-body);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.qhint .hdw{font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.15;color:var(--ink)}.blank{min-width:3.6em}
.xphelp{font-size:.9rem;color:var(--muted)}.xphelp summary{cursor:pointer;font-weight:800;color:var(--ink);padding:4px 0}.xphelp p{margin:6px 0}.xphelp ul{margin:6px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}.xphelp b{color:var(--ink)}
.lvlrow{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:12px}.lvlrow .lvltitle{font-size:1.55rem}.lvlrow .note{margin-top:4px;font-size:.85rem}.mon{width:96px;height:100px;cursor:pointer;-webkit-tap-highlight-color:transparent}.mon svg,.evo svg{width:100%;height:100%;display:block;overflow:visible}.lvlnum{align-self:start}

.mood-tongue svg{animation:mtongue 1.5s ease}.mood-salto svg{animation:msalto 1.4s ease}.tng{animation:mwag .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes mtongue{0%{transform:none}15%{transform:translateY(-12px) rotate(-8deg)}30%{transform:rotate(7deg)}45%{transform:translateY(-8px) rotate(-7deg)}60%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}100%{transform:none}}
@keyframes mwag{0%{transform:rotate(-9deg) scaleY(1)}100%{transform:rotate(9deg) scaleY(1.12)}}

.prog{font-weight:800;color:var(--ink)}.prog.done{color:var(--good)}
:root{
  /* Layout: eine schmale Spalte wie ein Handyspiel. Startseite = Levelkarte, Seitenwahl, grosser Startknopf. Quiz = eine Frage pro Bildschirm. */
  --bg:#e9effb;
  --surface:#ffffff;
  --ink:#14213d;
  --muted:#586389;
  --line:#d3dcf1;
  --accent:#ff6a3d;
  --accent-edge:#c8461c;
  --accent-ink:#ffffff;
  --xp:#ffc533;
  --xp-edge:#d9a000;
  --xp-ink:#4d3500;
  --good:#168a4e;
  --good-bg:#dcf4e6;
  --bad:#cf353c;
  --bad-bg:#fde5e6;
  --warn-bg:#fff0c7;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b2420;--surface:#133630;--ink:#effaf4;--muted:#9cc6b8;--line:#25514a;
    --accent:#ff4f9a;--accent-edge:#b81a66;--accent-ink:#2b0a18;
    --xp:#b8f56a;--xp-edge:#86c43a;--xp-ink:#1d3300;
    --good:#66e6a6;--good-bg:#12432f;--bad:#ff8a66;--bad-bg:#4a2619;--warn-bg:#4a1d3a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b2420;--surface:#133630;--ink:#effaf4;--muted:#9cc6b8;--line:#25514a;
  --accent:#ff4f9a;--accent-edge:#b81a66;--accent-ink:#2b0a18;
  --xp:#b8f56a;--xp-edge:#86c43a;--xp-ink:#1d3300;
  --good:#66e6a6;--good-bg:#12432f;--bad:#ff8a66;--bad-bg:#4a2619;--warn-bg:#4a1d3a;
  color-scheme:dark;
}
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --bg:#0b2420;--surface:#133630;--ink:#effaf4;--muted:#9cc6b8;--line:#25514a;
  --accent:#ff4f9a;--accent-edge:#b81a66;--accent-ink:#2b0a18;
  --xp:#b8f56a;--xp-edge:#86c43a;--xp-ink:#1d3300;
  --good:#66e6a6;--good-bg:#12432f;--bad:#ff8a66;--bad-bg:#4a2619;--warn-bg:#4a1d3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:14px 32px}
.app{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:1.35rem;text-wrap:balance}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}

/* Kopfzeile */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.5rem;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink)}
.brand span{color:var(--accent)}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.92rem;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px;flex:none}
.chip.streak svg{fill:var(--accent)}
.chip.lvl{background:var(--xp);border-color:var(--xp-edge);color:var(--xp-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.soundbtn{cursor:pointer;background:none;border:0;color:var(--muted);font-weight:800;font-size:.8rem;padding:6px 2px}

/* Karten */
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.levelcard{gap:12px}
.lvltitle{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.05;text-wrap:balance}
.lvlnum{font-family:var(--f-display);font-weight:700;font-size:1rem;background:var(--xp);color:var(--xp-ink);border-radius:12px;padding:4px 12px;white-space:nowrap}
.bar{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--xp);box-shadow:inset 0 -4px 0 var(--xp-edge);transition:width .5s ease}
.xptext{font-size:.9rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}

/* Geheimnis gefunden */
.dmbanner{position:sticky;top:0;align-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 22px;font:700 1.15rem var(--f-display);text-align:center;z-index:5;max-width:100%;line-height:1.2;box-shadow:0 5px 0 var(--accent-edge);animation:dmpop .4s cubic-bezier(.2,.9,.3,1.3);margin:-4px 0}
.dmbanner small{display:block;font:700 .82rem var(--f-body);opacity:.8}
@keyframes dmpop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.dmconf{position:absolute;top:-16px;width:9px;height:13px;pointer-events:none;animation:dmconf 1.8s ease-in forwards;z-index:6}
@keyframes dmconf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),120vh) rotate(var(--r))}}
/* Eigene Stimme */
.dmmicp{position:sticky;top:0;z-index:9;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.45);text-align:center}
.dmmicp b{font:700 1.05rem var(--f-display)}
.dmmicp .st{font:700 .9rem var(--f-body);color:var(--muted);min-height:1.3em}.dmmicp .st.rec{color:var(--accent)}
.dmmicp button{font:600 1rem var(--f-display);border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:10px 12px;cursor:pointer;min-height:46px}
.dmmicp button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dmmicp button:disabled{opacity:.5}
/* Schattenmodus: alles kippt ins Violette, die Monster schauen finster */
.beatcard.dark{background:#1a0f2e;border-color:#5b2d8a}
.beatcard.dark .dmc.g0{background:#1c1130}.beatcard.dark .dmc.g1{background:#150c26}
.beatcard.dark .dmmon{filter:hue-rotate(250deg) saturate(.8) brightness(.8)}
.beatcard.dark .dmsec,.beatcard.dark .dmtools .dmdice,.beatcard.dark .dmtools .dmmic{border-color:#5b2d8a;background:#120a20}
.dmpre button.lock{opacity:.35;filter:grayscale(1)}
.dmnext{font:700 .8rem var(--f-body);color:var(--muted);text-align:center}
.dmbanner.small{font-size:.95rem;padding:6px 16px}
.dmhr{display:flex;gap:6px;align-items:center}
.dmhelp{width:34px;padding:0;font-size:1rem}
.dmintro{position:absolute;inset:0;z-index:8;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;animation:dmpop .35s cubic-bezier(.2,.9,.3,1.3);overflow-y:auto}
.dmi-viz{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:84px}
.dmi-viz .dmi-m{width:64px;height:70px;cursor:pointer;animation:dmhop 1s ease-in-out infinite}
@keyframes dmhop{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px) scale(1.04,.96)}}
.dmi-g{display:grid;grid-template-columns:repeat(8,26px);gap:3px}
.dmi-g .dmc{height:30px;display:block}
.dmi-g .dmc.on{animation:dmblink 1.6s steps(1) infinite}
@keyframes dmblink{0%{box-shadow:0 0 0 3px var(--ink)}12%,100%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}}
.dmi-viz>.ico,.dmi-viz>svg{width:40px;height:40px}
.dmi-star{font-size:1.9rem;color:#ffc21f;letter-spacing:2px}.dmi-arrow{font-size:1.5rem;color:var(--muted)}.dmi-gift{font-size:2.4rem;animation:dmhop 1s ease-in-out infinite}
.dmi-t{font:700 1.3rem var(--f-display)}
.dmi-s{margin:0;font:600 .98rem/1.4 var(--f-body);max-width:30ch;color:var(--ink)}
.dmi-dots{display:flex;gap:6px}.dmi-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dmi-dots i.on{background:var(--ink)}
.dmi-bar{display:flex;gap:10px;align-items:center}
.dmi-spk{width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer}.dmi-spk svg{width:100%;height:100%}
.dmi-skip{border:0;background:none;color:var(--muted);font:700 .85rem var(--f-body);text-decoration:underline;cursor:pointer}
.dmi-play{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:1.1rem;padding-left:3px;box-sizing:border-box}
.tourbox.pop{animation:dmpop .35s cubic-bezier(.2,.9,.3,1.3)}
.dmdrop{height:54px;padding:0 12px;border-radius:16px;border:0;background:var(--xp);color:var(--xp-ink);box-shadow:0 4px 0 var(--xp-edge);font:800 .95rem var(--f-display);letter-spacing:.04em;cursor:pointer}
.dmdrop.on{animation:dmdropp .3s ease-in-out infinite alternate}
@keyframes dmdropp{to{transform:scale(1.08)}}
.beatcard.building .dmmon{animation:dmshiver .12s linear infinite}
@keyframes dmshiver{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5px) translateY(-1px)}}
.beatcard.dropped{animation:dmquake .45s cubic-bezier(.3,.7,.4,1)}
@keyframes dmquake{0%{transform:scale(1.04)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}100%{transform:none}}
.dmtitle,.dmsec{white-space:nowrap}

.beatcard{max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="app">
  <div class="themecard beatcard" id="beatCard"><div class="dmhead"><span class="dmtitle">Monster-Beatbox</span><span class="dmhr"><button type="button" class="dmsec" id="dmSec" aria-controls="dmSecList"></button><button type="button" class="dmsec dmhelp" id="dmKurz" aria-label="Kurzer Takt mit 8 Feldern" aria-pressed="false">16</button><button type="button" class="dmsec dmhelp" id="dmHelp" aria-label="So geht die Beatbox">?</button></span></div><div class="dmseclist" id="dmSecList" hidden></div><div class="dmpre" id="dmPre"></div><div class="dmgrid" id="dmGrid"></div><div class="dmbar"><button type="button" class="dmplay" id="dmPlay" aria-label="Abspielen"></button><button type="button" class="dmdrop" id="dmDrop" aria-label="Drop">DROP</button><div class="dmtempo"><button type="button" id="dmSlow" aria-label="Langsamer"><svg viewBox="0 0 48 48" aria-hidden="true" style="color:#1d0a14"><circle cx="24" cy="24" r="22" fill="var(--xp)"/><g transform="translate(11 11) scale(1.1)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="10.5" r="6"/><path d="M9.5 10.5a2.2 2.2 0 112.2 2.2M2.5 20h16.5a3 3 0 003-3v-4M20 13V8.5"/></g></svg></button><b id="dmBpm">100</b><button type="button" id="dmFast" aria-label="Schneller"><svg viewBox="0 0 48 48" aria-hidden="true" style="color:#1d0a14"><circle cx="24" cy="24" r="22" fill="var(--accent)"/><g transform="translate(11 11) scale(1.1)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8.8" cy="6" rx="2.2" ry="4.6"/><ellipse cx="15.2" cy="6" rx="2.2" ry="4.6"/><circle cx="12" cy="15" r="6.3"/><circle cx="9.6" cy="14" r=".9" fill="currentColor"/><circle cx="14.4" cy="14" r=".9" fill="currentColor"/></g></svg></button></div><button type="button" class="dmclr" id="dmClr" aria-label="Leeren"><svg viewBox="0 0 48 48" aria-hidden="true" style="color:#1d0a14"><circle cx="24" cy="24" r="22" fill="var(--ink)"/><g transform="translate(11 11) scale(1.1)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15.5l9-9a2 2 0 012.8 0l3.2 3.2a2 2 0 010 2.8L12 19H8z"/><path d="M9 11.5l5 5M12 19h8"/></g></svg></button></div></div>
</div>
<script>
(function(){
'use strict';
/* Monster-Beatbox: Spielstand, Icons, Vorlesen */
var KEY='monster-beatbox-v1'; /* fester Speicherschlüssel: nicht umbenennen, sonst geht der Beat verloren */
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return s;}catch(e){}return {};}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var IC_P='var(--accent)',IC_L='var(--xp)',IC_D='#1d0a14';
var ICONS={
  play:'<path d="M14 8l28 16-28 16z" fill="'+IC_D+'" stroke="'+IC_D+'" stroke-width="4" stroke-linejoin="round"/>',
  speak:'<circle cx="24" cy="24" r="21" fill="'+IC_L+'"/><path d="M11 20v8h6l8 6V14l-8 6z" fill="'+IC_D+'"/><path d="M30 18a8 8 0 0 1 0 12M35 13a15 15 0 0 1 0 22" stroke="'+IC_D+'" stroke-width="3.5" stroke-linecap="round" fill="none"/>'
};
function icoSvg(id){return '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true">'+(ICONS[id]||'')+'</svg>';}
/* Vorlesen mit der deutschen Gerätestimme */
function say(text,force){
  if(!text||!force||!window.speechSynthesis)return;
  try{var ss=speechSynthesis;if(ss.speaking||ss.pending)ss.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.9;
    var de=ss.getVoices().filter(function(v){return /^de/i.test(v.lang);});if(de[0])u.voice=de[0];
    ss.speak(u);}catch(e){}
}

/* Ton: AudioContext, Freischalten bei der ersten Berührung, Master-Ausgang mit Limiter */
var ac=null;
function getAC(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state!=='running'&&ac.resume){var p=ac.resume();if(p&&p.catch)p.catch(function(){});}
  }catch(e){}
  return ac;
}
/* Browser erlauben Ton erst nach einer Berührung oder Taste: bei der ersten Eingabe Audio freischalten */
['pointerdown','touchend','keydown','click'].forEach(function(ev){
  document.addEventListener(ev,function(){
    var c=getAC();
    if(c&&!c.__u){c.__u=1;try{var b=c.createBuffer(1,1,22050),sr=c.createBufferSource();sr.buffer=b;sr.connect(c.destination);sr.start(0);}catch(e){}}
  },true);
});
/* Lautstärke: alle Klänge laufen über Master-Gain + Limiter */
var _oc=null,_og=null;
function OUT(){if(_oc!==ac){_oc=ac;var g=ac.createGain();g.gain.value=2.8;var c=ac.createDynamicsCompressor();c.threshold.value=-14;c.knee.value=12;c.ratio.value=10;c.attack.value=.003;c.release.value=.15;g.connect(c);c.connect(ac.destination);_og=g;}return _og;}

/* Monster-Zeichnungen (aus NumNum: src/monster.js + Vokki-Gesichter) */
var STAGES=[
  {from:1,name:'Ei',snd:0,c:['#e6f9c4','#7fb83a','#f6ffe3']},
  {from:2,name:'Knackei',snd:0,c:['#9be35e','#6fbb36','#f4f7e6']},
  {from:3,name:'Schlüpfling',snd:1,c:['#b8f56a','#6aa91f','#efffd2']},
  {from:4,name:'Zottel',snd:1,c:['#ffa53a','#e07a14','#ffe2b8']},
  {from:5,name:'Stachling',snd:2,c:['#ff9ccc','#d94a8f','#ffe3f1']},
  {from:6,name:'Flatterling',snd:3,c:['#5aa8ff','#3a7ed8','#d2e8ff']},
  {from:8,name:'Flügeldrache',snd:3,c:['#6fe0d0','#1f9a8a','#d8fff8']},
  {from:9,name:'Glutdrache',snd:4,c:['#e2489a','#b32a74','#ffc4e2']},
  {from:11,name:'Feuerdrache',snd:4,c:['#ff8a5c','#d93a1f','#ffe2c8']},
  {from:13,name:'Kristalldrache',snd:5,c:['#7fd3ff','#4aa2e0','#e6f7ff']},
  {from:15,name:'Legende',snd:5,c:['#ffd75e','#e0a800','#fff4c4']},
  {from:17,name:'Sturmdrache',snd:6,c:['#5b7aa6','#3c5884','#bccfe9']},
  {from:20,name:'Schattendrache',snd:6,c:['#4a4f7a','#0b0d18','#c9d3ff']}
];
function stageOf(L){var s=0;STAGES.forEach(function(x,i){if(L>=x.from)s=i;});return s;}
/* Num: kleiner Drache im flachen Cartoon-Stil. Keine Umrisse: Formen leben von Farbe, eine dunklere Fläche derselben Farbe gibt Volumen.
   Jede Stufe hat eine eigene Silhouette. Augen und Mund sitzen immer an denselben Koordinaten, damit moodSvg passt. */
var monId=0;
var IRIS=['#ffe14d','#ffe14d','#fff06a','#7dffe0','#ffe14d','#fff1b0','#38f0ff'];
function flameSvg(x,y,a,b,k){
  k=k||1;
  return '<g class="tw"><path transform="translate('+x+' '+y+') scale('+k+')" d="M0 0q-7 -6 -3 -15q3 6 6 3q-1 -7 4 -12q5 10 2 18q-2 6 -9 6z" fill="'+a+'"/><path transform="translate('+x+' '+y+') scale('+k+')" d="M0 0q-3 -3 -1 -8q2 3 3 1q1 3 0 7z" fill="'+b+'"/></g>';
}
function spikyBody(){
  var pts=[],N=22,i,a,r,cx=60,cy=70;
  for(i=0;i<N*2;i++){
    a=Math.PI*2*i/(N*2)-Math.PI/2;
    r=(i%2?41:50);
    if(Math.sin(a)>0.35&&i%2===0)r=44;
    pts.push((cx+Math.cos(a)*r*1.02).toFixed(1)+' '+(cy+Math.sin(a)*r*0.9).toFixed(1));
  }
  return 'M'+pts.join('L')+'Z';
}
var SPIKY=spikyBody();
function mixHex(a,b,t){
  var p=function(h,i){return parseInt(h.substr(1+i*2,2),16);},r='#',i,v;
  for(i=0;i<3;i++){v=Math.round(p(a,i)*(1-t)+p(b,i)*t);r+=(v<16?'0':'')+v.toString(16);}
  return r;
}
/* Farben je Stufe: Grundfarbe, Schattenseite, Bauch/Flecken, Hornfarbe, Hornspitze, Iris */
var PAL=[
  {b:'#a6de6e',d:'#79bb45',l:'#dcf6bd',h:'#fff3c8',t:'#ffb43a',i:'#4fb3ff'},
  {b:'#86dc4b',d:'#5bb02a',l:'#dcf8bd',h:'#fff3c8',t:'#ff9a2e',i:'#ff9a2e'},
  {b:'#ff78b4',d:'#d9508f',l:'#ffc4de',h:'#b98cff',t:'#7b4dff',i:'#3cc7b4'},
  {b:'#36c4b2',d:'#21968a',l:'#b6f2e8',h:'#fff3c8',t:'#ffcf3a',i:'#ff6a8a'},
  {b:'#ff6b3d',d:'#d6432a',l:'#ffd3ad',h:'#fff0c4',t:'#ff9f2e',i:'#ffd23a'},
  {b:'#ffc83a',d:'#e39d12',l:'#fff1b6',h:'#ffffff',t:'#ff8a2a',i:'#ff4f7a'},
  {b:'#45478a',d:'#2a2b5c',l:'#5d61ad',h:'#a64dff',t:'#ff3df2',i:'#38f0ff'},
  {b:'#9be35e',d:'#6fbb36',l:'#f4f7e6',h:'#fff3c8',t:'#ffb43a',i:'#4fb3ff'},
  {b:'#ffa53a',d:'#e07a14',l:'#ffe2b8',h:'#fff3c8',t:'#ff5d8f',i:'#6a4dff'},
  {b:'#5aa8ff',d:'#3a7ed8',l:'#d2e8ff',h:'#ffd9ec',t:'#ff7bb0',i:'#ffb21f'},
  {b:'#e2489a',d:'#b32a74',l:'#ffc4e2',h:'#ffd166',t:'#ff6a1f',i:'#ffb21f'},
  {b:'#7fd3ff',d:'#4aa2e0',l:'#e6f7ff',h:'#ffffff',t:'#b9a4ff',i:'#8a5cff'},
  {b:'#5b7aa6',d:'#3c5884',l:'#bccfe9',h:'#e2e9f3',t:'#ffe14d',i:'#ffe14d'}
];
/* Reihenfolge der Stufen: Zahl = Bauplan (1 Ei … 7 Schattendrache, 8–13 die Zwischenstufen) */
var KIND=[1,8,2,9,3,10,4,11,5,12,6,13,7];
IRIS=KIND.map(function(n){return PAL[n-1].i;});
function monsterSvg(stage,mood){
  var n=KIND[stage],p=PAL[n-1],id='mg'+(++monId),K='#1b2340',W='#ffffff',MR='#6b1630',TG='#ff7b93';
  var s=['1','.78','.88','.94','1','1','1','1','.84','.9','.97','1','1'][n-1];
  var g='<svg viewBox="0 0 120 124" aria-hidden="true"'+((mood||n===7)?' class="'+(mood?'moodon ':'')+(n===7?'dark':'')+'"':'')+'><defs>'+
    (n===7?'<radialGradient id="'+id+'b"><stop offset="0" stop-color="#a64dff" stop-opacity=".6"/><stop offset=".55" stop-color="#38f0ff" stop-opacity=".2"/><stop offset="1" stop-color="#38f0ff" stop-opacity="0"/></radialGradient>':'')+
    '<radialGradient id="'+id+'a"><stop offset="0" stop-color="#ffe27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient></defs>';
  g+='<ellipse cx="60" cy="117" rx="32" ry="4.5" fill="#000" opacity=".14"/>';
  var cid=0;
  /* Körperfläche mit Schattenseite: dunkle Form, darüber die helle, nach links oben versetzt und auf die Form beschnitten */
  var blob=function(d,b,dk,dx,dy,extra){
    var c=id+'c'+(++cid);
    return '<clipPath id="'+c+'"><path d="'+d+'"/></clipPath><path d="'+d+'" fill="'+dk+'"/><g clip-path="url(#'+c+')"><path d="'+d+'" fill="'+b+'" transform="translate('+(dx==null?-8:dx)+' '+(dy==null?-6:dy)+')"/>'+(extra||'')+'</g>';
  };
  var mirror=function(inner){return '<g transform="translate(120 0) scale(-1 1)">'+inner+'</g>';};
  var limb=function(d,col,w){return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';};
  /* gestreiftes Horn: dicke Linie, darüber dieselbe Linie gestrichelt in der Spitzenfarbe */
  var stripeHorn=function(d,w){return limb(d,p.h,w)+'<path d="'+d+'" fill="none" stroke="'+p.t+'" stroke-width="'+w+'" stroke-dasharray="3.5 5" />';};
  /* spitzes Horn mit farbiger Spitze */
  var horn=function(bx,by,tx,ty,w){
    var ax=bx-w,bx2=bx+w,mx=bx+(tx-bx)*.55,my=by+(ty-by)*.55,k=.45;
    return '<path d="M'+ax+' '+by+'Q'+(mx-w*k)+' '+my+' '+tx+' '+ty+'Q'+(mx+w*k)+' '+my+' '+bx2+' '+by+'Z" fill="'+p.h+'"/>'+
      '<path d="M'+(bx+(tx-bx)*.6-w*.3)+' '+(by+(ty-by)*.6)+'L'+tx+' '+ty+'L'+(bx+(tx-bx)*.6+w*.3)+' '+(by+(ty-by)*.6)+'Z" fill="'+p.t+'"/>';
  };
  var eyes=function(X,ey,r,sc,ir){
    var o='<g class="eyes">';
    X.forEach(function(x){
      o+='<circle cx="'+x+'" cy="'+ey+'" r="'+r+'" fill="'+(sc||W)+'"/><circle cx="'+(x+r*.12)+'" cy="'+(ey+r*.1)+'" r="'+(r*.58)+'" fill="'+(ir||p.i)+'"/><circle cx="'+(x+r*.15)+'" cy="'+(ey+r*.12)+'" r="'+(r*.32)+'" fill="'+K+'"/><circle cx="'+(x-r*.12)+'" cy="'+(ey-r*.2)+'" r="'+(r*.17)+'" fill="#fff"/>';
    });
    return o+'</g>';
  };
  /* offener Mund: dunkelrot, Zunge unten, eckige Zähne oben */
  var mouth=function(cx,y,w,h,teeth,tc,cls){
    var c=id+'m'+(++cid),d='M'+(cx-w)+' '+y+'Q'+cx+' '+(y-h*.25)+' '+(cx+w)+' '+y+'Q'+(cx+w*.9)+' '+(y+h)+' '+cx+' '+(y+h)+'Q'+(cx-w*.9)+' '+(y+h)+' '+(cx-w)+' '+y+'Z';
    var o='<g class="'+(cls||'mouth')+'"><clipPath id="'+c+'"><path d="'+d+'"/></clipPath><path d="'+d+'" fill="'+MR+'"/><g clip-path="url(#'+c+')"><ellipse cx="'+cx+'" cy="'+(y+h)+'" rx="'+(w*.6)+'" ry="'+(h*.5)+'" fill="'+TG+'"/>';
    (teeth||[]).forEach(function(t){o+='<rect x="'+(cx+t[0])+'" y="'+(y-h*.3)+'" width="'+t[1]+'" height="'+(h*.3+t[2])+'" rx="1.2" fill="'+(tc||W)+'"/>';});
    return o+'</g></g>';
  };
  /* Einzelnes Auge: weiß, Iris, Pupille, Glanzpunkt; optional Lid (Anteil von oben, geneigt), Wimpern, Schlitzpupille, Blickrichtung */
  var eye=function(x,y,r,o){
    o=o||{};var c=id+'e'+(++cid),lx=(o.look||[0,0])[0]*r*.28,ly=(o.look||[0,0])[1]*r*.28;
    var e='<clipPath id="'+c+'"><circle cx="'+x+'" cy="'+y+'" r="'+r+'"/></clipPath><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(o.sc||W)+'"/><g clip-path="url(#'+c+')">';
    e+='<circle cx="'+(x+lx)+'" cy="'+(y+ly)+'" r="'+(r*(o.ir||.6))+'" fill="'+(o.iris||p.i)+'"/>';

    var cols=['#ff4f9a','#ffc21f','#6fe0d0','#b8f56a','#a98bff'],i;for(i=0;i<30;i++){var c=document.createElement('i');c.className='dmconf';c.style.left=(Math.random()*100)+'%';c.style.background=cols[i%5];c.style.setProperty('--dx',(Math.random()*120-60)+'px');c.style.setProperty('--r',(Math.random()*720)+'deg');c.style.animationDelay=(Math.random()*.4)+'s';bc.appendChild(c);setTimeout(function(c){c.remove()}.bind(null,c),2400);}

  function mood(m){mons.forEach(function(el,r){if(el)el.innerHTML=monsterSvg(MON[r].st,dark?'sad':m);});}

    else{pk[r]=((pk[r]||0)+1)%3;pat[r]=sndFix(id,COMMON[id][pk[r]].split('').map(function(ch){return ch==='.'?'0':ch;}).join(''));}

  function build(){
    grid.innerHTML='';cells=[];mons=[];var n=vis();

      mo.addEventListener('click',function(){now(M.id,brush[r]);dance(r);word(r,syl(M.id,brush[r])||'!');});

            if(!on&&!playing)now(M.id,brush[r]);changed();
          });
          row.appendChild(b);cells[r][s]=b;
        })(h*8+c);
        blk.appendChild(row);
      });
      var tl=document.createElement('div');tl.className='dmtools';
      if(BLK[M.id].length>1)BLK[M.id].forEach(function(bk,k){var b=document.createElement('button');b.type='button';b.className='dmbr c'+(k%5);b.textContent=bk[1];b.setAttribute('aria-pressed',brush[r]===bk[0]?'true':'false');
        b.addEventListener('click',function(){brush[r]=bk[0];now(M.id,bk[0]);dance(r);var k2=tl.querySelectorAll('.dmbr');[].forEach.call(k2,function(x,j){x.setAttribute('aria-pressed',j===k?'true':'false');});});tl.appendChild(b);});
      var dc=document.createElement('button');dc.type='button';dc.className='dmdice';dc.textContent='🎲';dc.setAttribute('aria-label','Vorschlag für '+STAGES[M.st].name);dc.addEventListener('click',function(){dice(r);if(!playing)setPlay(true);});tl.appendChild(dc);
      var mc=document.createElement('button');mc.type='button';mc.className='dmmic'+(useOwn(M.id)?' on':'');mc.textContent='🎤';mc.setAttribute('aria-label','Eigenes Geräusch für '+STAGES[M.st].name);mc.addEventListener('click',function(){micPanel(r);});tl.appendChild(mc);
      blk.appendChild(tl);grid.appendChild(blk);
    });

  }
  var brush=MON.map(function(m){return BLK[m.id][0][0];});
  function paint(){
    var r,s,n=vis();
    for(r=0;r<R;r++)if(cells[r].length)for(s=0;s<n;s++){var w=pat[r].charAt(s),b=cells[r][s];b.className=b.className.replace(/ ?(on|c\d)/g,'');if(w!=='0'){b.classList.add('on','c'+(blkIx(MON[r].id,w)%5));b.textContent=lbl(MON[r].id,w);}else b.textContent='';}

  }
  function head(s,hits){
    var r;

  }
  function loop(){
    var nw=ac.currentTime;
    while(queue.length&&queue[0].t<=nw){head(queue[0].s,queue[0].h);queue.shift();}
    if(playing)raf=requestAnimationFrame(loop);
  }
  function sched(){
    var six=st(),n=vis();
    while(nextT<ac.currentTime+.15){
      var s=step,t=nextT+((s%4===2)?six*sw:0),r,hits=[];
      if(s===0){checkSecrets();if(drop===1){drop=2;dropBuild(t,n*six);}else if(drop===2){drop=0;dropBoom(t);}}
      /* Drop: ein Takt Anlauf nur mit Hi-Hat und immer lauterem Trommelwirbel, die letzten zwei Schläge Stille, dann der Knall */
      if(drop===2){if(s<n-2){play('snare',t,[s,'p',2,.2+.8*s/n]);if(openRow(0)&&pat[0].charAt(s)!=='0')play('hats',t,[s,pat[0].charAt(s),2,1]);hits.push([3,'p']);}}
      else for(r=0;r<R;r++)if(openRow(r)){var w=pat[r].charAt(s);if(w!=='0'){play(MON[r].id,t,[s,w,2,1]);hits.push([r,w]);}}
      queue.push({s:s,t:t,h:hits});
      step=(step+1)%n;nextT+=six;
    }
  }
  function dropBuild(t,bar){
    var f=B.FILT.frequency,top=dark?1100:20000;f.cancelScheduledValues(t);f.setValueAtTime(320,t);f.exponentialRampToValueAtTime(top,t+bar*.9);
    var sr=ac.createBufferSource();sr.buffer=B.NZ;sr.loop=true;var bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=3;bp.frequency.setValueAtTime(400,t);bp.frequency.exponentialRampToValueAtTime(7000,t+bar*.85);
    var g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+bar*.85);g.gain.exponentialRampToValueAtTime(.0001,t+bar*.88);sr.connect(bp);bp.connect(g);g.connect(B.OUT);send(g,B.REV,.3);sr.start(t);sr.stop(t+bar);
    at(t,function(){bc.classList.add('building');});
  }
  function dropBoom(t){
    play('beat',t,[0,'b',2,1]);play('snare',t,[0,'s',2,1]);
    var g=vca(t,.005,.15,.9,.9,B.SAT),o=osc('sine',80,t,t+1.1,g);o.frequency.exponentialRampToValueAtTime(30,t+.9);
    at(t,function(){bc.classList.remove('building');dropB.classList.remove('on');bc.classList.remove('dropped');void bc.offsetWidth;bc.classList.add('dropped');
      if(!dark){mood('joy');setTimeout(function(){mood(null)},1600);}
      var cols=['#ff4f9a','#ffc21f','#6fe0d0','#b8f56a','#a98bff'],i;for(i=0;i<24;i++){var c=document.createElement('i');c.className='dmconf';c.style.left=(Math.random()*100)+'%';c.style.background=cols[i%5];c.style.setProperty('--dx',(Math.random()*120-60)+'px');c.style.setProperty('--r',(Math.random()*720)+'deg');bc.appendChild(c);setTimeout(function(c){c.remove()}.bind(null,c),2000);}});
  }
  function dropReset(){drop=0;bc.classList.remove('building');if(dropB)dropB.classList.remove('on');if(B){var f=B.FILT.frequency,t=ac.currentTime;f.cancelScheduledValues(t);f.setValueAtTime(dark?1100:20000,t);}}
  var dropB=document.getElementById('dmDrop');
  dropB.addEventListener('click',function(){if(drop)return;if(!playing)setPlay(true);if(!playing)return;drop=1;dropB.classList.add('on');});
  function setPlay(on){
    if(on===playing)return;
    if(on){
      try{getAC();if(!ac)return;if(ac.state==='suspended')ac.resume();bus();}catch(e){return;}
      playing=true;step=0;nextT=ac.currentTime+.06;queue=[];sched();timer=setInterval(sched,25);raf=requestAnimationFrame(loop);
      bc.classList.add('live');bc.style.setProperty('--beat',(120/(dark?bpm*.8:bpm))+'s');
    }else{
      playing=false;dropReset();clearInterval(timer);cancelAnimationFrame(raf);queue=[];head(-1);bc.classList.remove('live');
    }
    playB.innerHTML=icoSvg(on?'stop':'play');playB.classList.toggle('on',on);
  }
  ICONS.stop='<rect x="9" y="9" width="30" height="30" rx="7" fill="'+IC_D+'"/>';
  pre.innerHTML='';
  var SI={
    boombap:'<rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="8" cy="14" r="3"/><circle cx="16" cy="14" r="3"/><path d="M7 8V5h10v3"/>',
    house:'<path d="M3 11L12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
    funk:'<rect x="2.5" y="9" width="8" height="6" rx="2.5" fill="currentColor"/><rect x="13.5" y="9" width="8" height="6" rx="2.5" fill="currentColor"/><path d="M10.5 11h3M2.5 11L1 8M21.5 11L23 8"/>',
    rock:'<path d="M13 2L5 14h6l-1 8 9-12h-6z" fill="currentColor"/>',
    techno:'<rect x="5" y="7" width="14" height="12" rx="3"/><circle cx="9.5" cy="13" r="1.6" fill="currentColor"/><circle cx="14.5" cy="13" r="1.6" fill="currentColor"/><path d="M12 7V4"/><circle cx="12" cy="3.4" r="1.2" fill="currentColor"/>',
    trap:'<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3l-2 6 5 12M15 3l2 6-5 12"/>',
    disco:'<circle cx="12" cy="13.5" r="8"/><path d="M4 13.5h16M12 5.5v16M6 8.5c3 2 9 2 12 0M6 18.5c3-2 9-2 12 0M12 2v3.5"/>',
    bossa:'<path d="M12.5 22c0-6 0-9 1-12"/><path d="M13.5 10C9.5 6 5.5 8 4 10.5M13.5 10c3-4 7-3 8 0M13.5 10c-1-4 0-7 2-8.5M13.5 10C10 9 7 11 7 14.5"/>',
    dnb:'<path d="M12 2c4 3 5 8 3 14H9C7 10 8 5 12 2z"/><circle cx="12" cy="9" r="1.8" fill="currentColor"/><path d="M9 14l-3.5 4M15 14l3.5 4M12 18v4"/>',
    shuffle:'<rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="15" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="15" r="1.4" fill="currentColor"/><circle cx="15" cy="15" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/>',

  };
  BEATS.forEach(function(Bt,i){

  var INTRO=[

  function intro(){
    var old=bc.querySelector('.dmintro');if(old)old.remove();setPlay(false);
    var ov=document.createElement('div');ov.className='dmintro';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','So geht die Monster-Beatbox');bc.appendChild(ov);var i=0;

        '<div class="dmi-bar"><button type="button" class="dmi-spk" aria-label="Vorlesen">'+icoSvg('speak')+'</button><button type="button" class="btn dmi-go">'+(last?'Los geht\'s!':'Weiter')+'</button></div>'+
