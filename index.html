<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MSTR">
<title>MSTR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* MSTR: Schwarz, Weiß und ein Signal (Flieder). Farbe nur für Takt und Zustände: Playhead, Zählzeiten, Taktzähler, Fortschritt, Aufnahme, Schalter, gewählte Vorlage, laufende Wiedergabe. */
:root{
  --bg:#FFFFFF; --ink:#0F0F10; --mute:#8E8E94; --off:#EDEDEF; --line:#E4E4E7; --soft:#F4F4F5;
  --accent:#C7B3FF; --on-accent:#0F0F10;
  --f-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ed:"Instrument Serif",ui-serif,Georgia,serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));--gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E0E0F;--ink:#F3F3F4;--mute:#7A7A81;--off:#232326;--line:#2A2A2E;--soft:#19191B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E0F;--ink:#F3F3F4;--mute:#7A7A81;--off:#232326;--line:#2A2A2E;--soft:#19191B;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-top:max(14px,env(safe-area-inset-top,0px));padding-left:var(--gut);padding-right:var(--gutr);position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.mark{display:flex;align-items:center;gap:7px;font-weight:800;font-size:16px;letter-spacing:.14em}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.app.live .mark i{animation:pulse calc(60s / 120) ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.35)}}
.topr{display:flex;gap:8px;align-items:center}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink);padding:0}
.ib svg{width:18px;height:18px}
.ib.lg{width:48px;height:48px;font-size:24px;font-weight:500}
.pill{height:36px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pill.sm{height:30px;padding:0 12px;font-size:12px}
.pill.wide{width:100%;height:44px}
.pill:active,.ib:active{transform:scale(.97)}

.head{display:flex;flex-direction:column;gap:4px}
.preset{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:12px;cursor:pointer;font-family:var(--f-ed);font-size:clamp(42px,11vw,60px);font-weight:400;letter-spacing:-.01em;line-height:1;text-align:left;align-self:flex-start}
.preset svg{width:30px;height:30px;padding:6px;border-radius:50%;background:var(--soft);color:var(--ink);flex:none}
.sub{margin:0;font-size:13px;color:var(--mute)}

/* Raster: Name-Zeile über 16 Punkten; ab 640 px Name links */
.tracks{display:flex;flex-direction:column;gap:clamp(12px,2.6vh,24px)}
.trk{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;transition:opacity .2s}
.tl{display:flex;align-items:center;gap:8px;min-width:0}
.tn{border:0;background:none;padding:2px 0;cursor:pointer;display:flex;align-items:baseline;gap:8px;min-width:0;flex:1;text-align:left}
.tn .nm{white-space:nowrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.tn .tb{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .go{width:12px;height:12px;color:var(--mute);flex:none;align-self:center;margin-left:-4px}
.ms{width:26px;height:22px;border-radius:6px;border:1px solid var(--line);background:transparent;font-family:var(--f-mono);font-size:10px;font-weight:500;cursor:pointer;color:var(--mute);padding:0;flex:none}
.ms[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.trk.quiet .steps{opacity:.28}
/* Die eigene Spur Aufnahme steht etwas abgesetzt unter den eingebauten */
.trk.own{border-top:1px solid var(--line);padding-top:clamp(12px,2.6vh,24px)}
.steps{display:flex;gap:clamp(6px,2.4vw,14px)}
.grp{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(3px,1vw,6px)}
.dot{aspect-ratio:1;width:100%;max-width:100%;border-radius:50%;border:0;background:var(--off);padding:0;cursor:pointer;display:grid;place-items:center;font-family:var(--f-mono);font-size:clamp(8px,2.2vw,11px);font-weight:500;color:var(--bg);line-height:1;transition:background .1s,transform .1s,box-shadow .1s}
.dot.on{background:var(--ink)}
/* Zählzeiten 1, 5, 9, 13 leicht flieder, damit man ohne Hinsehen zählt */
.grp .dot:first-child:not(.on){background:color-mix(in srgb,var(--accent) 30%,var(--off))}
.dot.ph{box-shadow:0 0 0 2px var(--accent)}
.dot.on.ph{background:var(--accent);color:var(--on-accent);transform:scale(1.14)}
.beatrow .steps span{font-family:var(--f-mono);font-size:10px;color:var(--mute);text-align:center}
.beatrow{margin-top:-6px}
/* Taktzähler: die laufende Zählzeit sitzt im Flieder-Kreis */
.beatrow .grp span:first-child{justify-self:center;width:18px;height:18px;line-height:18px;border-radius:50%;transition:background .08s,color .08s}
.beatrow .grp span.cur{background:var(--accent);color:var(--on-accent);font-weight:500}
.beatrow .tl{display:none}
@media (min-width:640px){
  .trk{grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:center}
  .beatrow .tl{display:block}
}

/* Transport unten */
.transport{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;gap:10px;background:var(--bg);border-top:1px solid var(--line);margin-left:calc(-1 * var(--gut));margin-right:calc(-1 * var(--gutr));padding:12px var(--gutr) max(12px,env(safe-area-inset-bottom,0px)) var(--gut);z-index:5;transition:background .25s}
.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
/* Fortschrittslinie: die Linie über Play läuft beim Abspielen durch den Takt */
.transport::before{content:"";position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--accent);pointer-events:none}
.app.live .transport::before{width:calc(var(--prog,0) * 100%);transition:width .06s linear}
.play svg{width:20px;height:20px}
.play.on{background:var(--accent);color:var(--on-accent)}
#drop{height:44px;padding:0 18px}
#drop.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.app.building #drop{animation:pulse .25s ease-in-out infinite alternate}
.tempo{margin-left:auto;border:0;background:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:4px 0;line-height:1}
.tv{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tempo .chev{width:30px;height:30px;padding:6px;border-radius:50%;background:var(--soft);color:var(--ink);flex:none}
.big{font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;font-size:32px}
.big small{font-size:.42em;color:var(--mute);font-weight:600;letter-spacing:0;margin-left:2px}
.swt{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* Blätter */
/* Unterseiten: ganze Seiten, die von rechts hereinschieben */
.sheet{position:fixed;inset:0;overflow:auto;overscroll-behavior:contain;background:var(--bg);z-index:21;
  padding:max(14px,env(safe-area-inset-top,0px)) var(--gutr) max(28px,env(safe-area-inset-bottom,0px)) var(--gut);display:flex;flex-direction:column;gap:22px;animation:in .22s cubic-bezier(.2,.8,.2,1)}
.sheet>*{width:100%;max-width:560px;margin-inline:auto}
@keyframes in{from{transform:translateX(28px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet.half{inset:auto 0 0 0;margin-inline:auto;max-width:760px;max-height:72vh;border-radius:28px 28px 0 0;box-shadow:0 -1px 0 var(--line),0 -24px 48px -24px rgba(0,0,0,.25);padding-top:10px;gap:20px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(48px);opacity:0}}
.catcher{position:fixed;inset:0;z-index:20}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.pnav .sp{width:36px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ed{font-family:var(--f-ed);font-weight:400;font-size:44px;line-height:.92;letter-spacing:-.01em;margin:0}
.ed em{font-style:normal;color:var(--mute)}
.tt{margin:4px 0 0;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1}
.plist{display:flex;flex-direction:column}
@media (max-width:599px){.sheet>.plist{width:auto;max-width:none;margin-inline:calc(-1 * var(--gut)) calc(-1 * var(--gutr))}}
@media (min-width:600px){.pitem{padding-inline:12px}}
.pitem{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px var(--gutr) 13px var(--gut);border:0;border-top:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;width:100%}
.pitem .n{font-size:17px;font-weight:600;letter-spacing:-.01em}
.pitem .v{font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pitem .v small{font-size:10px;color:var(--mute);font-weight:600;margin-left:3px;letter-spacing:.04em}
.pitem.sel{background:var(--accent);color:var(--on-accent);padding-block:18px 20px;border-top-color:transparent}
.pitem.sel .v{font-size:38px}
.pitem.sel small{color:var(--on-accent);opacity:.6}
.pitem.sel + .pitem{border-top-color:transparent}
.bpmrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bpmrow .big{font-size:72px;display:flex;align-items:baseline}
.bpmrow input{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;width:3ch;text-align:right;padding:0;-moz-appearance:textfield;appearance:textfield}
.bpmrow input::-webkit-inner-spin-button,.bpmrow input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.slider{display:flex;flex-direction:column;gap:10px}
.slider .lb{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--mute)}
.slider .lb b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--mute)}
input[type=range]::-moz-range-track{height:1px;background:var(--mute)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);margin-top:-10px;border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:0}
.swbar{position:relative;height:28px;border-bottom:1px solid var(--line)}
.swbar i{position:absolute;bottom:0;width:3px;height:40%;border-radius:2px;background:var(--mute);transition:left .15s}
.swbar i.q{height:100%;background:var(--ink)}
.field{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:13px;color:var(--mute)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 button{height:42px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg2.sm{flex:1}
.seg2.sm button{height:30px;font-size:12px}
.recbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 4px;overflow:hidden}
.rings{position:absolute;top:0;left:50%;width:220px;height:140px;transform:translateX(-50%);pointer-events:none}
.rings i{position:absolute;left:50%;top:58px;border-radius:50%;border:1px solid var(--line);transform:translate(-50%,-50%);transition:border-color .2s}
.rings i:nth-child(1){width:96px;height:96px}
.rings i:nth-child(2){width:144px;height:144px}
.rings i:nth-child(3){width:184px;height:184px;opacity:.6}
.recbox.on .rings i{border-color:var(--accent);animation:ring .5s ease-out infinite alternate}
.recbox.on .rings i:nth-child(2){animation-delay:.1s}
.recbox.on .rings i:nth-child(3){animation-delay:.2s}
@keyframes ring{to{transform:translate(-50%,-50%) scale(1.06)}}
.rec{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.rec i{width:22px;height:22px;border-radius:50%;background:var(--accent);transition:border-radius .2s}
.recbox.on .rec i{border-radius:5px}
.rec:disabled{cursor:default}
.recst{margin:0;font-size:13px;color:var(--mute);text-align:center;min-height:1.45em}
.recbox.count .recst{font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.recbox.on .recst{color:var(--ink);font-weight:600}
.more{display:flex;flex-direction:column;gap:22px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .pill{flex:1}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 10px 10px 18px;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:500;z-index:30;white-space:nowrap;animation:fade .2s;max-width:calc(100% - 32px)}
.toast button{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px;padding:6px 12px;cursor:pointer}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Tempo-Zahl in der Serifenschrift, wie der Beat-Name */
.tempo .big,.bpmrow .big{font-family:var(--f-ed);font-weight:400;letter-spacing:-.01em}
.tempo .big{font-size:42px}
.bpmrow .big{font-size:88px}
.tempo .big small,.bpmrow .big small{font-family:var(--f-ui);font-weight:600;margin-left:4px}

/* Spur-Icons: feine Linien in Tinte, beim Anschlag kurz Flieder */
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .12s}
.ic svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic svg .f{fill:var(--ink);stroke:none}
.ic.hit{background:var(--accent)}
.ic.hit svg{stroke:var(--on-accent)}
.ic.hit svg .f{fill:var(--on-accent)}
.trk.quiet .ic{opacity:.35}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <span class="mark"><i aria-hidden="true"></i>MSTR</span>
    <div class="topr">
      <button type="button" class="pill" id="clr">Leeren</button>
      <button type="button" class="ib" id="theme" aria-label="Farbschema"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <div class="head">
    <button type="button" class="preset" id="preBtn" aria-haspopup="dialog"><span id="preName">Lo-Fi</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <p class="sub" id="sub">Vorlage</p>
  </div>
  <main class="tracks" id="tracks" aria-label="Spuren"></main>
  <div class="trk beatrow" aria-hidden="true"><div class="tl"></div><div class="steps"><div class="grp"><span>1</span><span></span><span></span><span></span></div><div class="grp"><span>2</span><span></span><span></span><span></span></div><div class="grp"><span>3</span><span></span><span></span><span></span></div><div class="grp"><span>4</span><span></span><span></span><span></span></div></div></div>
  <footer class="transport">
    <button type="button" class="play" id="play" aria-label="Abspielen (Leertaste)"></button>
    <button type="button" class="pill" id="drop">Drop</button>
    <button type="button" class="tempo" id="tempoBtn" aria-haspopup="dialog" aria-label="Tempo und Swing"><span class="tv"><span class="swt" id="swTxt">Swing 0 %</span><span class="big"><span id="bpm">100</span><small>bpm</small></span></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</div>
<section class="sheet" id="sheet" aria-labelledby="sheetT" hidden></section>
<script>
(function(){
'use strict';
/* MSTR: Speicherstand und Farbschema */
var KEY='mstr-v1'; /* fester Speicherschlüssel: nicht umbenennen, sonst geht der Beat verloren */
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return s;}catch(e){}return {};}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}

/* Farbschema: System, hell oder dunkel */
var THEMES=['system','light','dark'];
function applyTheme(){
  var t=THEMES.indexOf(S.theme)>=0?S.theme:'system',de=document.documentElement;
  if(t==='system')de.removeAttribute('data-theme');else de.setAttribute('data-theme',t);
  var dark=t==='dark'||(t==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',dark?'#0E0E0F':'#FFFFFF');
  return t;
}
applyTheme();

/* Ton: AudioContext, Freischalten bei der ersten Berührung, Master-Ausgang mit Limiter */
var ac=null;
function getAC(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state!=='running'&&ac.resume){var p=ac.resume();if(p&&p.catch)p.catch(function(){});}
  }catch(e){}
  return ac;
}
/* Browser erlauben Ton erst nach einer Berührung oder Taste: bei der ersten Eingabe Audio freischalten */
['pointerdown','touchend','keydown','click'].forEach(function(ev){
  document.addEventListener(ev,function(){
    var c=getAC();
    if(c&&!c.__u){c.__u=1;try{var b=c.createBuffer(1,1,22050),sr=c.createBufferSource();sr.buffer=b;sr.connect(c.destination);sr.start(0);}catch(e){}}
  },true);
});
/* Lautstärke: alle Klänge laufen über Master-Gain + Limiter */
var _oc=null,_og=null;
function OUT(){if(_oc!==ac){_oc=ac;var g=ac.createGain();g.gain.value=2.8;var c=ac.createDynamicsCompressor();c.threshold.value=-14;c.knee.value=12;c.ratio.value=10;c.attack.value=.003;c.release.value=.15;g.connect(c);c.connect(ac.destination);_og=g;}return _og;}

/* 13 Vorlagen (Stil, Tempo, Swing, Kick/Snare/Hat; genutzt werden die ersten 16 Schritte). Die erste ist die Start-Vorlage */

function playSynth(id,t,n){
  if(id==='mic')return;

  if(id==='beat'){var kl=bpm>=128?.38:.22;
    var g=vca(t,.001,0,kl,1.05*v,kl>.3?B.SAT:B.OUT);var o=osc('sine',150,t,t+kl+.05,g);o.frequency.exponentialRampToValueAtTime(kl>.3?44:52,t+.07);

    else if(w==='k'){nz(t,.025,.35*v,'bandpass',3400,3);}
    else{nz(t,.004,.35*v,'highpass',3000);nz(t+.003,.045,.32*v,'bandpass',7200,1.3);}}
  else if(id==='snare'){
    if(w==='c'){[0,.009,.019].forEach(function(o2,i){nz(t+o2,.012,.5*v,'bandpass',1400+i*300,1.6);});nz(t+.026,.16,.5*v,'bandpass',3200,.8,.25);}
    else if(w==='p'){nz(t,.014,.8*v,'lowpass',900,1);nz(t+.008,.16,.6*v,'bandpass',2300,.7,.18);var gp=vca(t,.001,0,.05,.18*v);osc('triangle',240,t,t+.07,gp);}
    else if(w==='k'){nz(t,.007,.6*v,'highpass',4000);nz(t+.004,.08,.7*v,'bandpass',1700,2.2,.15);var gk=vca(t,.001,0,.04,.2*v);osc('triangle',420,t,t+.06,gk);}
    else{nz(t,.012,.7*v,'lowpass',900,1);nz(t+.01,.45,.45*v,'bandpass',4300,.8,.3);}}
  else if(id==='click'){
    /* Percussion: Shaker, Tamburin, Clave, Conga, Cowbell */
    if(w==='1'){var gs=band(t,.12,'bandpass',6500,1.4,B.DUCK);gs.gain.setValueAtTime(0,t);gs.gain.linearRampToValueAtTime(.32*v,t+.018);gs.gain.exponentialRampToValueAtTime(.001,t+.1);
      var g2=band(t,.06,'highpass',9000,.7,B.DUCK);g2.gain.setValueAtTime(.12*v,t+.012);g2.gain.exponentialRampToValueAtTime(.001,t+.05);}
    else if(w==='2'){var gj=vca(t,.001,0,.14,.14*v,B.DUCK),fj=ac.createBiquadFilter(),hj=ac.createBiquadFilter();fj.type='bandpass';fj.frequency.value=9000;fj.Q.value=1;hj.type='highpass';hj.frequency.value=6000;fj.connect(hj);hj.connect(gj);
      [5100,6300,7400,8900].forEach(function(f){osc('square',f,t,t+.16,fj);});
      [0,.022].forEach(function(o2,i){var gn=band(t+o2,.12,'highpass',7500,.7,B.DUCK);gn.gain.setValueAtTime((i?.16:.28)*v,t+o2);gn.gain.exponentialRampToValueAtTime(.001,t+o2+.09);send(gn,B.REV,.06);});}
    else if(w==='3'){var gv=vca(t,.001,0,.045,.38*v,B.DUCK);osc('sine',2500,t,t+.07,gv);var gv2=vca(t,.001,0,.012,.06*v,B.DUCK);osc('triangle',5000,t,t+.03,gv2);send(gv,B.REV,.15);}
    /* Conga: Fellmoden einer Trommel (unharmonische Verhältnisse) ohne Gleitton, dazu der Handanschlag */
    else if(w==='4'){[[1,1,.18],[1.59,.45,.07],[2.14,.25,.05],[2.65,.15,.035]].forEach(function(m){var gm=vca(t,.001,0,m[2],.42*m[1]*v,B.DUCK);osc('sine',300*m[0],t,t+m[2]+.05,gm);send(gm,B.REV,.1);});
      var gh=band(t,.06,'bandpass',900,.9,B.DUCK);gh.gain.setValueAtTime(.35*v,t);gh.gain.exponentialRampToValueAtTime(.001,t+.03);nz(t,.006,.18*v,'highpass',2500,.7,0,B.DUCK);}
    /* Cowbell: unharmonische Teiltöne einer echten Kuhglocke, jeder mit eigenem Ausklang, dazu der Stockanschlag */
    else{[[587,1,.28],[845,.85,.34],[1245,.35,.12],[1640,.45,.1],[2470,.25,.07],[3330,.15,.05]].forEach(function(m){var gm=vca(t,.0015,0,m[2],.11*m[1]*v,B.DUCK),om=osc('sine',m[0],t,t+m[2]+.05,gm);om.frequency.setValueAtTime(m[0]*1.006,t);om.frequency.exponentialRampToValueAtTime(m[0],t+.02);send(gm,B.REV,.08);});
      nz(t,.008,.25*v,'bandpass',3200,1.5,0,B.DUCK);nz(t,.004,.15*v,'highpass',6000,.7,0,B.DUCK);}}
  /* Becken: viele unharmonische Sinus-Teiltöne (fest ausgewürfelt, damit jeder Schlag gleich klingt), jeder mit eigenem Ausklang.
     Das ergibt den schimmernden Metallklang; Rauschen gibt es nur für den Stockanschlag */
  else if(id==='cym'){
    if(w==='r')cymbal(t,v*.3,{lo:2500,hi:9000,n:14,dec:.7,lp:6000,stick:.08,rev:.08});
    else if(w==='h')cymbal(t,v*.9,{lo:600,hi:7000,n:24,dec:.8,lp:9000,stick:.35,rev:.15,trash:1});

  else if(id==='fx'){

      var gk=vca(t,.001,0,.018,.12*v,B.DUCK);osc('sine',260,t,t+.04,gk);}
    /* Sub: kurzer, tiefer 808-Bass, läuft über die Sättigung */

    else if(w==='l'){for(var i=0;i<6;i++)playSynth('snare',t+i*six/2,[0,'p',1,v*(.3+.12*i)]);}

  var BACK='<div class="pnav"><button type="button" class="ib" data-close aria-label="Zurück"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="mark"><i aria-hidden="true"></i>MSTR</span><span class="sp"></span></div>';
  /* half: Blatt von unten (Tempo), der Sequencer bleibt darüber sichtbar */
  var catcher=document.createElement('div');catcher.className='catcher';catcher.hidden=true;document.body.appendChild(catcher);
  catcher.addEventListener('click',function(){closeSheet();});
  function openSheet(html,init,name,half){
    lastFocus=document.activeElement;sheet.innerHTML=(half?'<div class="grab" aria-hidden="true"></div>':BACK)+html;sheet.hidden=false;sheet.scrollTop=0;
    sheet.classList.toggle('half',!!half);catcher.hidden=!half;
    if(!half)document.body.classList.add('noscroll');
    sheet.querySelector('[data-close]').addEventListener('click',closeSheet);
    if(init)init(sheet);
    var f=sheet.querySelector('[data-focus]')||sheet.querySelector('button');if(f)f.focus({preventScroll:true});
    pageName=name;if(location.hash!=='#'+name){pushed=true;location.hash=name;}
  }
  function hideSheet(){sheet.hidden=true;catcher.hidden=true;sheet.innerHTML='';document.body.classList.remove('noscroll');if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}
  function closeSheet(){if(sheet.hidden)return;hideSheet();if(pushed){pushed=false;ignoreHash=true;history.back();}}
  window.addEventListener('hashchange',function(){if(ignoreHash){ignoreHash=false;return;}if(!sheet.hidden&&location.hash!=='#'+pageName){pushed=false;hideSheet();}});
  var X='',XB='<button type="button" class="ib" data-close aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>';
  function presetSheet(){
    var order=BEATS.map(function(b,i){return i;}).sort(function(a,b){return BEATS[a].bpm-BEATS[b].bpm||a-b;});
    openSheet('<div class="sh-top"><h2 class="ed" id="sheetT">'+BEATS.length+' Vorlagen<br><em>nach Tempo</em></h2>'+X+'</div><div class="plist" role="listbox" aria-label="Vorlagen"></div>',function(el){
      var list=el.querySelector('.plist');
      order.forEach(function(i){var Bt=BEATS[i],b=document.createElement('button');b.type='button';b.className='pitem'+(i===pre?' sel':'');b.setAttribute('role','option');b.setAttribute('aria-selected',i===pre?'true':'false');
        if(i===pre)b.setAttribute('data-focus','');
        b.innerHTML='<span class="n">'+NM[Bt.n]+'</span><span class="v">'+Bt.bpm+'<small>BPM</small></span>';
        b.addEventListener('click',function(){fromBeat(i);paint();persist();closeSheet();if(!playing)setPlay(true);});list.appendChild(b);});
    },'vorlagen');
  }
  $('preBtn').addEventListener('click',presetSheet);

  function tempoSheet(){
    var taps=[];
    openSheet('<div class="sh-top"><span class="eyebrow" id="sheetT">Tempo und Swing</span>'+XB+'</div>'+
      '<div class="bpmrow"><button type="button" class="ib lg" id="tDown" aria-label="Langsamer">−</button><label class="big" for="tBpm"><input id="tBpm" type="number" inputmode="numeric" min="60" max="180" value="'+bpm+'" aria-label="Tempo in BPM"><small>bpm</small></label><button type="button" class="ib lg" id="tUp" aria-label="Schneller">+</button></div>'+
      '<button type="button" class="pill wide" id="tTap">Tippen für Tempo</button>'+
      '<div class="slider"><div class="lb"><span>Swing auf jedem zweiten Achtel</span><b id="tSwV"></b></div><input type="range" id="tSw" min="0" max="60" step="1" value="'+Math.round(sw*100)+'" aria-label="Swing in Prozent"></div>'+
      '<div class="swbar" id="tSwBar" aria-hidden="true"></div>',function(el){
      var inp=el.querySelector('#tBpm'),sl=el.querySelector('#tSw');
      function setB(v){bpm=Math.round(num(v,60,180,bpm));inp.value=bpm;paint();persist();}
      function swUI(){el.querySelector('#tSwV').textContent=sl.value+' %';var h='',k;for(k=0;k<8;k++)h+='<i class="'+(k%2?'':'q')+'" style="left:'+(k/8*100+(k%2?sw*100/16:0))+'%"></i>';el.querySelector('#tSwBar').innerHTML=h;}
      el.querySelector('#tDown').addEventListener('click',function(){setB(bpm-1);});
      el.querySelector('#tUp').addEventListener('click',function(){setB(bpm+1);});
      inp.addEventListener('change',function(){setB(inp.value);});
      el.querySelector('#tTap').addEventListener('click',function(){var n=performance.now();taps=taps.filter(function(t){return n-t<2500;});taps.push(n);if(taps.length>1)setB(60000*(taps.length-1)/(n-taps[0]));});
      sl.addEventListener('input',function(){sw=sl.value/100;swUI();paint();});
      sl.addEventListener('change',persist);
      swUI();
    },'tempo',true);
  }
  $('tempoBtn').addEventListener('click',tempoSheet);

  function trackSheet(r){
    var T=TRACKS[r],id=T.id,mic=r===MIC,busy=false;
    /* Nur die Spur Aufnahme hat das Mikrofon, ganz oben. Die übrigen Spuren klingen immer eingebaut */
    var REC_UI=mic?'<div class="recbox"><div class="rings" aria-hidden="true"><i></i><i></i><i></i></div><button type="button" class="rec" id="kRec" aria-label="Eigenen Klang aufnehmen, 1 Sekunde"><i></i></button>'+
      '<p class="recst" id="kRecSt" aria-live="polite"></p></div>':'';
    openSheet('<div class="sh-top"><div><span class="eyebrow">Spur '+(r+1)+' von '+R+'</span><h2 class="tt" id="sheetT">'+T.n+'</h2></div>'+X+'</div>'+REC_UI+
      '<div class="more" id="kMore">'+
      (T.s.length>1?'<div class="field"><span class="lbl">'+(mic?'Tonhöhe für neue Schritte':'Klang für neue Schritte')+'</span><div class="opts" id="kSnd"></div></div>':'')+
      '<div class="slider"><div class="lb"><span>Lautstärke</span><b id="kVolV"></b></div><input type="range" id="kVol" min="0" max="100" step="1" value="'+Math.round(vol[r]*100)+'" aria-label="Lautstärke '+T.n+'"></div>'+
      '<div class="seg2"><button type="button" id="kMute">Stumm</button><button type="button" id="kSolo">Solo</button></div>'+
      '<div class="acts"><button type="button" class="pill" id="kDice">Vorschlag</button><button type="button" class="pill" id="kClr">Spur leeren</button>'+(mic?'<button type="button" class="pill" id="kDel">Aufnahme löschen</button>':'')+'</div></div>',function(el){
      var vs=el.querySelector('#kVol');
      function ui(){
        el.querySelector('#kVolV').textContent=vs.value+' %';
        el.querySelector('#kMute').setAttribute('aria-pressed',mute[r]?'true':'false');
        el.querySelector('#kSolo').setAttribute('aria-pressed',solo[r]?'true':'false');
        if(mic){var has=!!REC.mic;el.querySelector('#kMore').hidden=!has;
          if(!busy)el.querySelector('#kRecSt').textContent=has?'Dein Klang ist gespeichert. Tippen zum Neuaufnehmen.':'Nimm 1 Sekunde auf: klatschen, schnipsen, ein Wort, ein Glas.';}
        var o=el.querySelector('#kSnd');if(o)[].forEach.call(o.children,function(b,k){b.setAttribute('aria-pressed',T.s[k][0]===brush[r]?'true':'false');});
      }
      var o=el.querySelector('#kSnd');
      if(o)T.s.forEach(function(sd){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=sd[1];
        b.addEventListener('click',function(){brush[r]=sd[0];now(id,sd[0],gainOf(r));ui();paint();persist();});o.appendChild(b);});
      vs.addEventListener('input',function(){vol[r]=vs.value/100;ui();});
      vs.addEventListener('change',function(){persist();now(id,brush[r],gainOf(r));});
      el.querySelector('#kMute').addEventListener('click',function(){mute[r]=!mute[r];ui();paint();persist();});
      el.querySelector('#kSolo').addEventListener('click',function(){solo[r]=!solo[r];ui();paint();persist();});
      el.querySelector('#kDice').addEventListener('click',function(){dice(r);if(!playing)setPlay(true);});
      el.querySelector('#kClr').addEventListener('click',function(){pat[r]=zero();changed();});
      if(mic){
        el.querySelector('#kDel').addEventListener('click',function(){dropRec(id);pat[r]=zero();changed();ui();});
        var rb=el.querySelector('#kRec'),stE=el.querySelector('#kRecSt'),box=el.querySelector('.recbox');
        rb.addEventListener('click',function(){if(busy)return;busy=true;rb.disabled=true;
          record(id,function(msg,lv){stE.textContent=msg;box.classList.toggle('count',lv===1);box.classList.toggle('on',lv===2);},
            function(ok){busy=false;rb.disabled=false;box.classList.remove('on','count');
              /* Erste Aufnahme in eine leere Spur: gleich auf 2 und 4 legen, damit man sie im Beat hört */
              if(ok&&pat[r]===zero()){pat[r]=dots(COMMON.mic[0]);changed();}
              ui();paint();});});
      }
      ui();
    },'spur-'+id);
  }
  function dice(r){
    var id=TRACKS[r].id,ix;
    if(r<3){do{ix=Math.floor(Math.random()*BEATS.length);}while(ix===lastDice[r]&&BEATS.length>1);lastDice[r]=ix;pat[r]=rowFromBeat(BEATS[ix],id);}
    else{pk[r]=((pk[r]||0)+1)%3;pat[r]=dots(COMMON[id][pk[r]]);}
    changed();
  }

  /* ---------- Leeren mit Rückgängig ---------- */
  var toast=null,undo=null;
  function showToast(msg,act,fn){
    if(toast)toast.remove();toast=document.createElement('div');toast.className='toast';toast.setAttribute('role','status');
    toast.innerHTML='<span>'+msg+'</span>'+(act?'<button type="button">'+act+'</button>':'');app.appendChild(toast);
    var t=toast;if(act)t.querySelector('button').addEventListener('click',function(){fn();t.remove();});
    setTimeout(function(){if(t.parentNode)t.remove();},5000);
  }
  $('clr').addEventListener('click',function(){
    undo={g:pat.slice(),pre:pre,ed:edited};pat=empty();pre=-1;edited=false;paint();persist();
    showToast('Alle Spuren geleert','Rückgängig',function(){pat=undo.g;pre=undo.pre;edited=undo.ed;paint();persist();});
  });

  /* ---------- Farbschema ---------- */
  var TN={system:'wie System',light:'hell',dark:'dunkel'};
  function themeUI(){var t=applyTheme();$('theme').setAttribute('aria-label','Farbschema: '+TN[t]);$('theme').title='Farbschema: '+TN[t];}
  $('theme').addEventListener('click',function(){var t=THEMES.indexOf(S.theme);S.theme=THEMES[(t<0?1:t+1)%3];save();themeUI();});
  if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeUI);}catch(e){}

  build();themeUI();playB.innerHTML=I_PLAY;
  window.MSTR={setPlay:setPlay,state:function(){return {pat:pat.slice(),bpm:bpm,sw:sw,pre:pre,playing:playing};}};
})();

})();
</script>
</body>
</html>
